action_rules:
  greenfield: "Recommendations/actions can link to a design opportunity with no existing gap; do not fabricate current controls or actual deficiencies."
  legacy: "Keep gap_id/recommendation_id and existing action fields. Added relationship arrays cannot contradict scalar legacy references; preserve and flag conflicts rather than overwrite."
  no_change: "Link the canonical no_change_scenario_id; residual_risk_until_complete is not a license to invent risk scores or losses."
  authority: "Owner, date, budget, priority rating and approval need their own basis; do not infer approval or implementation from a draft recommendation."
