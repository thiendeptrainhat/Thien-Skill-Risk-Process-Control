template: "qa-checklist"
schema_version: "1.1.0"
output_metadata:
  analysis_layers: []
  source_references: []
  data_classification: null
  assumptions: []
  confidence: "Unresolved"
  unresolved_items: []
  review_status: "Not reviewed"

analysis_layers_in_scope: []
checks:
  package:
    skill_frontmatter_valid: false
    required_files_present: false
    relative_links_valid: false
    license_hashes_match: false
    no_absolute_private_paths: false
    no_secrets_detected: false
  process:
    objective_trigger_boundaries_present: false
    owner_inputs_outputs_present: false
    no_orphan_steps: false
    decision_routes_complete: false
    layers_not_mixed: false
  risk_control:
    risks_follow_cause_event_impact_objective: false
    controls_are_testable: false
    key_controls_have_rationale: false
    no_operating_effectiveness_without_evidence: false
    external_sources_have_applicability: false
  rcm_sod_spof:
    ids_and_relationships_valid: false
    all_views_preserve_relationships: false
    potential_and_actual_sod_separated: false
    spof_assesses_backup_and_capacity: false
  outputs:
    source_references_present: false
    assumptions_and_confidence_visible: false
    human_approval_gates_visible: false
    cross_document_tie_out_complete: false
  open_world_and_sources:
    seeds_not_treated_as_exhaustive: false
    mapping_scope_and_rationale_visible: false
    external_ids_not_invented: false
    no_reliable_match_or_missing_decisions_preserved: false
    content_verification_scoped_to_claim: false
    access_ai_use_and_redistribution_separated: false
    provisional_proposal_not_standard_claim: false
  control_comparison:
    logical_ids_and_scoped_observations_separated: false
    comparison_links_correct_layer_scope_period: false
    equivalent_controls_compared_by_objective: false
    keyness_not_inferred_from_library_label: false
    evidence_gap_not_treated_as_absence_or_failure: false
    no_change_exposure_has_basis_and_uncertainty: false
    greenfield_recommendation_has_no_fake_gap: false
  input_and_compatibility:
    capability_and_permission_not_assumed: false
    document_evidence_optional_and_execution_truthful: false
    unread_coverage_and_upstream_status_preserved: false
    legacy_fields_ids_nulls_and_design_assessment_preserved: false
    observations_do_not_invent_legacy_layer_or_performance: false
    narrow_questions_use_proportionate_workflow: false
# Existing booleans remain for 1.0.0 readers. A false placeholder is not evidence
# that a check ran and failed; execution status and rationale are recorded here.
check_execution:
  - check_path: null
    status: "not_run"
    scope: null
    evidence_reference: null
    rationale: null
    reviewer: null
    reviewed_at: null
check_execution_rules:
  statuses: [not_run, pass, fail, inconclusive, not_applicable]
  assertion: "Never mark a check pass from an empty template or treat an unrun default false as a confirmed deficiency."
result:
  status: "Not run"
  failed_checks: []
  limitations: []
  reviewer: null
  reviewed_at: null
