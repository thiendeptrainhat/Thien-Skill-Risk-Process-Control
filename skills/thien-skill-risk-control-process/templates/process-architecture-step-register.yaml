mapping_rules:
  seed_profiles: "94 seed profiles are discovery examples, not an exhaustive taxonomy or an obligatory workflow."
  reference_ids: "Use an external item ID only when actually read; keep internal process IDs separate. A proposed E2E name is not a standardized reference ID."
  multiplicity: "Allow several E2E/reference mappings with primary/supporting/overlap rationale; do not force an exact match."
  missing_context: "Keep no_reliable_match/unresolved and ask the distinguishing question; do not invent a score or choose an acronym meaning."
