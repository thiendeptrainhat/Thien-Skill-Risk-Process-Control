record_rules:
  identity: "controls.control_id remains the logical ID. Shared risks/processes do not create duplicate controls; equal names alone do not justify merging IDs."
  legacy_fields: "Preserve all 1.0.0 fields, including design_assessment, scalar control_objective_id/process_id/step_id and original source_reference. New arrays supplement them, not silently override them."
  projection: "controls retains the legacy single-layer projection. Where a new projection is produced, legacy_projection_observation_id names its exact supporting observation; otherwise leave it null and retain the original record."
  migration: "A sourced legacy record may yield an observation only with the layer/scope/period it actually supports. Keep the original and legacy_record_reference; missing extensions never imply a new analysis layer or verified performance."
  baseline: "baseline_basis may identify a requirement, principle, practice or analyst proposal. A proposal has no invented source citation; a verified source-derived claim requires scoped content, applicability and permitted use."
  keyness: "Assess key/supporting/alternative/compensating status by risk and objective coverage, alternatives and dependencies. Candidate designation is not organizational approval."
  evidence: "An As-Performed observation needs suitable operating evidence for its assessed scope/period; SOP-only or unread content cannot establish it. Preserve conflicting or upstream-unverified observations."
