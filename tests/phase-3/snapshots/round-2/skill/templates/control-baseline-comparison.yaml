comparison_rules:
  references: "Resolve baseline_link_ids in control-register and source_ids in source_register. Reuse scoped observations; do not duplicate or overwrite their facts in this view."
  layers: "Documented/designed/performed/target observation lists must contain the corresponding analysis_layer and compatible scope/period. Logical CTL IDs alone do not establish coverage."
  baseline: "An analyst proposal without a verified source is permissible when labeled, but is not a mandatory standard or a compliance baseline."
  equivalence: "Compare objective/coverage/timing/precision/independence/evidence/dependencies; different wording or automation level does not itself create a gap."
  gap: "Missing description, evidence limitation, design weakness and an observed operating deviation are distinct. Absence in reviewed scope is not proof of nonexistence."
  unknown: "Keep coverage_assessment null when not assessed, or evidence_insufficient/conflicting_evidence when supported; neither is an automatic failed control."
  no_change: "scenario_basis distinguishes a substantiated gap from a hypothesis/design opportunity. A future scenario is not an actual incident; protection and exposure inherit the evidence limits."
  quantification: "Do not invent probability, loss, score or horizon. Quantification needs supplied/approved methodology and data; missing horizon remains null."
  proportionality: "Use only relevant comparisons/scenarios; do not force a full register for a narrow question or fake a current-state gap for greenfield advice."
