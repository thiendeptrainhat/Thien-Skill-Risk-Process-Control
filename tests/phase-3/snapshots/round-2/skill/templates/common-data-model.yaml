schema_name: "thien-process-risk-control-common-data-model"
schema_version: "1.1.0"
language_policy: "Follow the user's language; preserve precise English terms."
compatibility_policy:
  extension_basis: "Additive fields and objects; retain original 1.0.0 records, IDs, values, nulls, source locators and design_assessment."
  missing_extension_fields: "Missing means not provided/not assessed as appropriate, never performed, verified, false or zero."
  legacy_projection: "Keep the original controls/RCM fields. A new projection may name the exact observation it represents; do not silently replace legacy facts with another layer or period."
  migration: "Create an observation only from an identifiable source record with supported layer/scope. Preserve the original record and its locator; do not copy arbitrary descriptions into a new analysis layer."
  incompatible_change: "If additive reading cannot preserve meaning, stop that migration and request a schema/version decision. Compatibility is a contract to verify, not a behavioral test result."
analysis_layers:
  - "As-Documented"
  - "As-Designed"
  - "As-Performed"
  - "Target-State"
confidence_basis:
  - "Documented"
  - "Interview-confirmed"
  - "Evidence-confirmed"
  - "Data-confirmed"
  - "Inferred"
  - "Unresolved"
null_semantics:
  null: "No structured value is available."
  not_provided: "The source did not provide the value."
  not_applicable: "The field does not apply; provide a reason when not obvious."
  to_be_validated: "An assertion exists but lacks sufficient verification."
  unresolved: "Conflicting or insufficient evidence prevents resolution."
