required_traceability_chains:
  objective_to_action:
    - "BusinessObjective"
    - "EndToEndProcess"
    - "Process"
    - "Subprocess"
    - "Activity"
    - "Task"
    - "Risk"
    - "ControlObjective"
    - "Control"
