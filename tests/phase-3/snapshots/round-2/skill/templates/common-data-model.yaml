    - "Process"
    - "Risk"
    - "ControlObjective"
    - "Control"
    - "Evidence"
traceability_applicability:
  scope: "The legacy chains describe relationships where applicable, not an instruction to manufacture every object for every question. Record missing/unused branches with their reason."
  greenfield: "A recommendation may link to a DesignOpportunity and objective without an existing Gap or performed Control."
  evidence: "A missing Evidence or TestAttribute is a limitation, not permission to invent one or conclude failure."
  control_identity: "control_id is a stable logical identity; an external catalogue ID or an equal name is not proof that two controls are the same."
  observations: "control_observation_id identifies one supported description/assessment with its own layer, scope, period, sources and evidence. Preserve conflicting observations."
  comparisons: "Reference baseline_link_ids and the correct scoped observation IDs. A logical control_id alone cannot establish documented, designed or performed coverage."
  source_use: "A source is not verified for every claim just because metadata, one page or one clause was checked. Keep claim scope and use rights separate."
extension_statuses:
  capability_status: [available, unavailable, not_checked, permission_required]
  fit_status: [supported_match, candidate_match, partial_match, no_reliable_match, unresolved]
  content_verification_status: [not_checked, overview_verified, content_verified]
  ai_use_status: [not_assessed, conditions_to_check, permission_evidenced, restricted_pending_permission]
  coverage_assessment: [alignment_supported, potential_gap, documented_gap, evidence_insufficient, conflicting_evidence, not_applicable]
extension_status_rules:
  fit_status: "Use rationale/evidence, not invented similarity percentages. An organization-specific proposed name must not masquerade as a reference-library identifier."
  content_verification_status: "content_verified applies only to content_checked_scope; it does not imply currency, applicability, AI-use permission, redistribution permission or organizational compliance."
  access_and_rights: "Record access_status, ai_use_status and redistribution_status with separate bases; permission in one field cannot populate another."
  coverage_assessment: "documented_gap means a gap substantiated in the stated comparison scope, not a synonym for As-Documented. Gap type/rationale remain separate; evidence_insufficient is not a failed control."
  assessment: "Preserve design_assessment. assessment_status/evidence_status describe assessment progress and evidence sufficiency, not substitutes for missing source values."
  default_state: "A null/empty template row is a skeleton, not a real object or proof that a fact/relationship does not exist. Omit unused rows or use empty collections."
