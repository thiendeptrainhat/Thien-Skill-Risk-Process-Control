source_use_rules:
  preserve_legacy: "Keep source_id/source_type/version/source_reference/current_status and original values; date_verified is not interchangeable with an attempted date_checked."
  scoped_verification: "content_verified covers only the recorded locators/content_checked_scope. Overview/search metadata never verifies a clause or control baseline."
  rights: "Public access, possession of a file, AI-use and redistribution permissions are distinct; keep unresolved permissions unresolved."
  handoff: "Preserve upstream document/evidence IDs in source_id_links and locators; map to source_id without silently renaming or upgrading UNVERIFIED/HUMAN_REVIEW_REQUIRED content. Carry known/material per-source access and AI-use conditions with source/rights locators; include corresponding source records when IDs alone cannot resolve at the receiver. This is not a demand for fresh license proof for every user SOP."
  privacy: "Do not put confidential content into external lookup queries or transfer artifacts without authority."
